server:
  address: 0.0.0.0
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:192.168.150.102}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:062017}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  datasource:
    url: jdbc:mysql://localhost:3306/ai_chat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_PASSWORD:062017}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-61007e72a25844aaa7904178806ea899}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

    mcp:
      client:
        enabled: false
        request-timeout: 120s
        toolcallback:
          enabled: true
        stdio:
          connections:
            # Filesystem: read/write/search files in the allowed directory
            # Set MCP_FILESYSTEM_PATH env var to change the allowed directory
            filesystem:
              command: cmd.exe
              args:
                - /c
                - mcp-server-filesystem
                - "${user.home}"
            # Brave Search: real-time web search (requires BRAVE_API_KEY env var)
            # Get a free key at https://brave.com/search/api/
            # Uncomment to enable after setting BRAVE_API_KEY:
            # brave-search:
            #   command: cmd.exe
            #   args:
            #     - /c
            #     - npx
            #     - -y
            #     - "@modelcontextprotocol/server-brave-search"
            #   env:
            #     BRAVE_API_KEY: "${BRAVE_API_KEY}"

app:
  jwt:
    secret: ${JWT_SECRET:AyerAIAgentDefaultSecretKey2024ForJWT!!}
    expiration-days: 7
  ai:
    qwen:
      api-key: ${DASHSCOPE_API_KEY:sk-1db11d8ad51c44caad5ef4e52e5ca41f}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      model: qwen-plus
  # Bocha AI Search — web search API (register at https://open.bochaai.com, 1000 free calls)
  websearch:
    api-key: ${WEB_SEARCH_API_KEY:sk-6e67f3ffa84f435d8d117919b25d03b0}
    endpoint: https://api.bochaai.com/v1/web-search
  # Ark API — video generation (即梦AI / Seedance)
  ark:
    api-key: ${ARK_API_KEY:ark-264d77ec-b683-421f-a5c9-bfb2b0712ced-ce42d}
    endpoint: https://ark.cn-beijing.volces.com/api/v3
    model: ${ARK_VIDEO_MODEL:doubao-seedance-1-0-pro-fast-251015}

  video:
    storage:
      path: ${VIDEO_STORAGE_PATH:./data/videos}
    ffmpeg:
      path: D:/install/ffmpeg/ffmpeg-8.1.1-full_build/bin/ffmpeg.exe

  elasticsearch:
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9201}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    kb-dir: ${KB_DIR:./knowledge-base}
    refresh-enabled: ${KB_REFRESH_ENABLED:true}
    refresh-interval-ms: ${KB_REFRESH_INTERVAL_MS:300000}

logging:
  level:
    # SocketException: Connection reset is expected when the client aborts the SSE stream.
    # Tomcat logs it internally before our IOException catch runs — suppress it here.
    org.apache.catalina.connector: ERROR

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
